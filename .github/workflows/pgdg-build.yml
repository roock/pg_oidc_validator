name: PGDG

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pgdg-build:
    name: Build
    runs-on: ${{ (matrix.arch == 'armhf' || matrix.arch == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        distro:
          - name: Debian 12
            codename: bookworm
            image: debian:bookworm-slim      
          - name: Debian 13
            codename: trixie
            image: debian:trixie-slim
          - name: Ubuntu 24.04
            codename: noble
            image: ubuntu:noble
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: ${{ matrix.distro.image }}          
          before-build-hook: dch -D ${{ matrix.distro.codename }} --local ~${{ matrix.distro.codename }}+git${{ github.sha }} ""
          buildpackage-opts: --build=binary --no-sign
          host-arch: ${{ matrix.arch }}
          extra-repos: |
            deb https://apt.postgresql.org/pub/repos/apt ${{ matrix.distro.codename }}-pgdg main
          extra-repo-keys: |
